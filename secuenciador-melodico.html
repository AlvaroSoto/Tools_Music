<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secuenciador melódico — Tools_Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="./shared/ui.css">
<style>
.tm-root { max-width: 880px; }
.opt-row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; font-size:11px; color:#888; margin-bottom:14px; }
.opt-row select, .opt-row input[type=range] { vertical-align:middle; }
.opt-row select { background:var(--tm-panel-2); color:#ddd; border:0.5px solid var(--tm-overlay-18); border-radius:6px; padding:5px 8px; font-family:'Space Mono',monospace; font-size:11px; }
.opt-row input[type=range] { accent-color:var(--tm-accent); width:90px; }
.roll-wrap { overflow-x:auto; border:0.5px solid var(--tm-overlay-08); border-radius:10px; background:#0d0d0d; padding:6px; }
.roll { border-collapse:collapse; table-layout:fixed; }
.roll td { width:30px; height:22px; padding:0; }
.roll .rowlabel { width:42px; font-size:9px; color:#666; text-align:right; padding-right:6px; white-space:nowrap; }
.roll .rowlabel.inkey { color:#9ecbff; }
.cell { width:28px; height:20px; border:0.5px solid var(--tm-overlay-06); border-radius:3px; cursor:pointer; background:var(--tm-overlay-02); }
.cell.beat { border-left:1px solid var(--tm-overlay-18); }
.cell.inkey { background:rgba(52,152,219,0.07); }
.cell.on { background:var(--tm-accent); border-color:transparent; }
.cell.playing { outline:2px solid var(--tm-overlay-70); outline-offset:-2px; }
.cell.blackrow { background:rgba(255,255,255,0.0); }
.controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:14px 0; }
#status { font-size:10px; color:#666; }
</style>
</head>
<body>
<div class="tm-root">
  <div class="tm-top">
    <div style="display:flex;align-items:center;gap:12px;">
      
      <div class="tm-title">SECUENCIADOR</div>
    </div>
    <div class="tm-controls">
      <div class="tm-stepper">BPM <button class="tm-step-btn" id="bpmDown">&minus;</button><input type="range" min="40" max="240" value="110" id="bpmSlider"><span class="tm-stepper-val" id="bpmVal">110</span></div>
      <button class="tm-btn accent" id="playBtn"><i class="ti ti-player-play"></i> PLAY</button>
    </div>
  </div>

  <div class="opt-row">
    <label>Tonalidad: <select id="keySel"></select></label>
    <label>Escala: <select id="scaleSel"></select></label>
    <label>Pasos: <select id="stepsSel"><option>8</option><option selected>16</option><option>32</option></select></label>
    <label>Onda: <select id="waveSel"><option value="triangle" selected>Triángulo</option><option value="sine">Seno</option><option value="square">Cuadrada</option><option value="sawtooth">Sierra</option></select></label>
  </div>

  <div class="roll-wrap">
    <table class="roll" id="roll"></table>
  </div>

  <div class="controls">
    <button class="tm-btn" id="clearBtn"><i class="ti ti-trash"></i> LIMPIAR</button>
    <button class="tm-btn export-btn accent" id="btnMidi"><i class="ti ti-file-download"></i> EXPORTAR MIDI</button>
    <button class="tm-btn export-btn accent" id="btnWav"><i class="ti ti-music"></i> EXPORTAR WAV</button>
    <span id="status"></span>
  </div>
  <div class="tm-hint">clic en celda = nota · azul = nota dentro de la escala elegida</div>
</div>

<script src="./shared/audio.js"></script>
<script src="./shared/synth.js"></script>
<script src="./shared/theory.js"></script>
<script src="./shared/midi.js"></script>
<script>
(function(){
  'use strict';
  const T = window.TMTheory, S = window.TMSynth, A = window.TMAudio, M = window.TMMidi;

  const LOW = 48, HIGH = 72; // C3..C5, 25 filas (alto→bajo al pintar)
  let steps = 16, bpm = 110, wave = 'triangle';
  let key = 0, scale = 'major';
  let playing = false, curStep = 0, timer = null;
  // grid[midi][step] = bool
  const grid = {};

  function resetGrid(){
    for(let m=LOW;m<=HIGH;m++) grid[m] = new Array(steps).fill(false);
  }

  function inScale(midi){
    const set = new Set(T.scaleNotes(60+key, scale).map(n=>((n%12)+12)%12));
    return set.has(((midi%12)+12)%12);
  }
  function isBlack(midi){ return [1,3,6,8,10].includes(((midi%12)+12)%12); }

  function fillSelectors(){
    const keySel=document.getElementById('keySel'), scaleSel=document.getElementById('scaleSel');
    keySel.innerHTML=''; T.NOTES_SHARP.forEach((n,i)=>{ const o=document.createElement('option');o.value=i;o.textContent=n;keySel.appendChild(o); });
    scaleSel.innerHTML=''; Object.keys(T.SCALES).forEach(k=>{ const o=document.createElement('option');o.value=k;o.textContent=T.SCALES[k].name;scaleSel.appendChild(o); });
    scaleSel.value=scale;
  }

  function build(){
    const table=document.getElementById('roll'); table.innerHTML='';
    for(let m=HIGH;m>=LOW;m--){
      const tr=document.createElement('tr');
      const lbl=document.createElement('td');
      lbl.className='rowlabel'+(inScale(m)?' inkey':'');
      lbl.textContent=T.midiToName(m,false);
      tr.appendChild(lbl);
      for(let s=0;s<steps;s++){
        const td=document.createElement('td');
        const cell=document.createElement('div');
        cell.className='cell'+(s%4===0?' beat':'')+(inScale(m)?' inkey':'')+(grid[m][s]?' on':'');
        cell.dataset.midi=m; cell.dataset.step=s;
        cell.addEventListener('click',()=>{
          grid[m][s]=!grid[m][s];
          cell.classList.toggle('on',grid[m][s]);
          if(grid[m][s]) S.playNote(T.midiToFreq(m),{dur:0.4,gain:0.4,type:wave});
        });
        td.appendChild(cell); tr.appendChild(td);
      }
      table.appendChild(tr);
    }
  }

  function repaintKey(){
    document.querySelectorAll('.rowlabel').forEach(()=>{});
    document.querySelectorAll('.cell').forEach(c=>{
      const m=parseInt(c.dataset.midi);
      c.classList.toggle('inkey', inScale(m));
    });
    document.querySelectorAll('.rowlabel').forEach((l,idx)=>{
      const m = HIGH - idx;
      l.classList.toggle('inkey', inScale(m));
    });
  }

  function tick(){
    const c=A.getCtx(), now=c.currentTime;
    document.querySelectorAll('.cell.playing').forEach(x=>x.classList.remove('playing'));
    for(let m=LOW;m<=HIGH;m++){
      if(grid[m][curStep]){
        S.playNote(T.midiToFreq(m),{ctx:c,when:now,dur:60/bpm/2*0.9,gain:0.4,type:wave});
      }
    }
    document.querySelectorAll('.cell[data-step="'+curStep+'"]').forEach(x=>x.classList.add('playing'));
    curStep=(curStep+1)%steps;
  }

  function start(){ playing=true; curStep=0; const b=document.getElementById('playBtn'); b.innerHTML='<i class="ti ti-player-stop"></i> STOP'; b.classList.add('playing'); timer=setInterval(tick,60/bpm/2*1000); }
  function stop(){ playing=false; clearInterval(timer); const b=document.getElementById('playBtn'); b.innerHTML='<i class="ti ti-player-play"></i> PLAY'; b.classList.remove('playing'); document.querySelectorAll('.cell.playing').forEach(x=>x.classList.remove('playing')); }

  function setBpm(v){ bpm=Math.max(40,Math.min(240,v|0)); document.getElementById('bpmVal').textContent=bpm; document.getElementById('bpmSlider').value=bpm; if(playing){ clearInterval(timer); timer=setInterval(tick,60/bpm/2*1000); } }

  // Recolecta notas como {midi,start,dur} en NEGRAS (cada paso = media negra/corchea)
  function collectNotes(){
    const beatPerStep = 0.5; // corcheas
    const notes=[];
    for(let m=LOW;m<=HIGH;m++){
      let s=0;
      while(s<steps){
        if(grid[m][s]){
          let len=1; while(s+len<steps && grid[m][s+len]){ len++; }
          notes.push({ midi:m, start:s*beatPerStep, dur:len*beatPerStep, velocity:92 });
          s+=len;
        } else s++;
      }
    }
    return notes;
  }

  function exportMidi(){
    const notes=collectNotes();
    if(!notes.length){ setStatus('Nada que exportar'); return; }
    const blob=M.build(notes,{bpm,ppq:480});
    A.downloadBlob(blob,'melodia.mid');
    setStatus('MIDI descargado'); setTimeout(()=>setStatus(''),3000);
  }

  async function exportWav(){
    const notes=collectNotes();
    if(!notes.length){ setStatus('Nada que exportar'); return; }
    setStatus('Renderizando…');
    const secPerBeat=60/bpm;
    const loopDur=steps*0.5*secPerBeat;
    const final=await A.renderLoop(loopDur,(off)=>{
      notes.forEach(n=>{
        const o=off.createOscillator(), g=off.createGain();
        o.type=wave; o.frequency.value=T.midiToFreq(n.midi);
        o.connect(g); g.connect(off.destination);
        const t=n.start*secPerBeat, end=t+n.dur*secPerBeat;
        g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(0.32,t+0.01);
        g.gain.exponentialRampToValueAtTime(0.0001,end);
        o.start(t); o.stop(end+0.05);
      });
    },{tailExtra:1.5});
    A.downloadBlob(A.bufferToWav(final),'melodia.wav');
    setStatus('WAV descargado'); setTimeout(()=>setStatus(''),3000);
  }

  function setStatus(m){ document.getElementById('status').textContent=m; }

  document.getElementById('bpmSlider').addEventListener('input',function(){ setBpm(parseInt(this.value)); });
  document.getElementById('bpmDown').addEventListener('click',()=>setBpm(bpm-1));
  document.getElementById('bpmUp')?.addEventListener('click',()=>setBpm(bpm+1));
  document.getElementById('playBtn').addEventListener('click',()=>{ if(playing) stop(); else start(); });
  document.getElementById('keySel').addEventListener('change',function(){ key=parseInt(this.value); repaintKey(); });
  document.getElementById('scaleSel').addEventListener('change',function(){ scale=this.value; repaintKey(); });
  document.getElementById('waveSel').addEventListener('change',function(){ wave=this.value; });
  document.getElementById('stepsSel').addEventListener('change',function(){
    const was=playing; if(playing) stop();
    steps=parseInt(this.value); resetGrid(); build();
    if(was) start();
  });
  document.getElementById('clearBtn').addEventListener('click',()=>{ const was=playing; if(playing) stop(); resetGrid(); build(); if(was) start(); });
  document.getElementById('btnMidi').addEventListener('click',exportMidi);
  document.getElementById('btnWav').addEventListener('click',exportWav);

  fillSelectors(); resetGrid(); build();
})();
</script>
<script src="./shared/nav.js"></script>
</body>
</html>
