<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acordes de oído — Tools_Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="./shared/ui.css">
<style>
.tm-root { max-width: 640px; }
.score { display:flex; gap:10px; margin-bottom:16px; }
.score-box { flex:1; background:var(--tm-panel-2); border:0.5px solid var(--tm-overlay-08); border-radius:10px; padding:10px 14px; text-align:center; }
.score-box .lbl { font-size:9px; letter-spacing:1px; color:#666; }
.score-box .val { font-family:'Bebas Neue',sans-serif; font-size:30px; color:var(--tm-color-white); }
.opt-row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; font-size:11px; color:#888; margin-bottom:16px; }
.opt-row select { background:var(--tm-panel-2); color:#ddd; border:0.5px solid var(--tm-overlay-18); border-radius:6px; padding:6px 9px; font-family:'Space Mono',monospace; font-size:12px; }
.play-area { text-align:center; margin:18px 0; }
.replay { width:90px; height:90px; border-radius:50%; font-size:13px; }
.mini { margin-left:8px; }
.choices { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px; margin-top:8px; }
.choice { background:var(--tm-panel-2); border:0.5px solid var(--tm-overlay-12); border-radius:9px; padding:12px 8px; cursor:pointer; text-align:center; transition:background 0.1s, border-color 0.1s; }
.choice:hover { background:rgba(155,89,182,0.18); }
.choice .ab { font-family:'Bebas Neue',sans-serif; font-size:20px; color:var(--tm-color-white); letter-spacing:1px; }
.choice .nm { font-size:9px; color:#888; }
.choice.correct { background:rgba(39,174,96,0.25); border-color:var(--tm-ok); }
.choice.wrong { background:rgba(231,76,60,0.25); border-color:var(--tm-accent); }
.choice.disabled { pointer-events:none; opacity:0.55; }
.feedback { text-align:center; min-height:22px; font-size:13px; letter-spacing:1px; margin-top:14px; }
.feedback.ok { color:var(--tm-ok); }
.feedback.no { color:var(--tm-accent); }
.next-btn { display:block; margin:12px auto 0; }
</style>
</head>
<body>
<div class="tm-root">
  <div class="tm-top">
    <div style="display:flex;align-items:center;gap:12px;">
      
      <div class="tm-title">ACORDES</div>
    </div>
  </div>

  <div class="score">
    <div class="score-box"><div class="lbl">ACIERTOS</div><div class="val" id="sOk">0</div></div>
    <div class="score-box"><div class="lbl">INTENTOS</div><div class="val" id="sTotal">0</div></div>
    <div class="score-box"><div class="lbl">RACHA</div><div class="val" id="sStreak">0</div></div>
  </div>

  <div class="opt-row">
    <label>Dificultad:
      <select id="diffSel">
        <option value="easy">Fácil (mayor / menor)</option>
        <option value="medium" selected>Media (+ dim / aug)</option>
        <option value="hard">Difícil (+ séptimas)</option>
      </select>
    </label>
    <label>Modo:
      <select id="modeSel">
        <option value="block" selected>En bloque</option>
        <option value="arp">Arpegiado</option>
      </select>
    </label>
  </div>

  <div class="play-area">
    <button class="tm-btn accent replay" id="replayBtn"><i class="ti ti-volume"></i><br>ESCUCHAR</button>
  </div>

  <div class="choices" id="choices"></div>
  <div class="feedback" id="feedback">&nbsp;</div>
  <button class="tm-btn next-btn" id="nextBtn" style="display:none;">SIGUIENTE <i class="ti ti-arrow-right"></i></button>
</div>

<script src="./shared/audio.js"></script>
<script src="./shared/synth.js"></script>
<script src="./shared/theory.js"></script>
<script>
(function(){
  'use strict';
  const T = window.TMTheory, S = window.TMSynth;

  const SETS = {
    easy:   ['maj','min'],
    medium: ['maj','min','dim','aug'],
    hard:   ['maj','min','dim','aug','maj7','min7','dom7']
  };

  let ok=0, total=0, streak=0;
  let rootMidi=60, curType='maj', answered=false;

  function rngInt(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }

  function playChord(){
    const c = window.TMAudio.getCtx();
    const notes = T.chordNotes(rootMidi, curType);
    const arp = document.getElementById('modeSel').value==='arp';
    notes.forEach((m,i)=>{
      const delay = arp ? i*180 : 0;
      setTimeout(()=> S.playNote(T.midiToFreq(m), {ctx:window.TMAudio.getCtx(), dur:1.3, gain:0.38, type:'triangle'}), delay);
    });
  }

  function renderChoices(){
    const set = SETS[document.getElementById('diffSel').value];
    const wrap = document.getElementById('choices');
    wrap.innerHTML='';
    set.forEach(key=>{
      const ch = T.CHORDS[key];
      const c = document.createElement('div'); c.className='choice'; c.dataset.key=key;
      c.innerHTML = '<div class="ab">'+(ch.symbol||'maj')+'</div><div class="nm">'+ch.name+'</div>';
      c.addEventListener('click', ()=>guess(key, c));
      wrap.appendChild(c);
    });
  }

  function newRound(){
    answered=false;
    document.getElementById('feedback').textContent=' ';
    document.getElementById('feedback').className='feedback';
    document.getElementById('nextBtn').style.display='none';
    renderChoices();
    const set = SETS[document.getElementById('diffSel').value];
    curType = set[rngInt(0,set.length-1)];
    rootMidi = rngInt(55,64);
    playChord();
  }

  function guess(key, el){
    if(answered) return;
    answered=true; total++;
    const correct = key===curType;
    document.querySelectorAll('.choice').forEach(c=>{
      c.classList.add('disabled');
      if(c.dataset.key===curType) c.classList.add('correct');
    });
    const fb = document.getElementById('feedback');
    if(correct){
      ok++; streak++;
      fb.textContent='✓ Correcto · '+T.CHORDS[curType].name;
      fb.className='feedback ok';
    } else {
      streak=0;
      el.classList.add('wrong');
      fb.textContent='✗ Era '+T.CHORDS[curType].name;
      fb.className='feedback no';
    }
    document.getElementById('sOk').textContent=ok;
    document.getElementById('sTotal').textContent=total;
    document.getElementById('sStreak').textContent=streak;
    document.getElementById('nextBtn').style.display='block';
  }

  document.getElementById('replayBtn').addEventListener('click', playChord);
  document.getElementById('nextBtn').addEventListener('click', newRound);
  document.getElementById('diffSel').addEventListener('change', newRound);
  document.getElementById('modeSel').addEventListener('change', ()=>{ if(!answered) playChord(); });

  renderChoices();
  newRound();
})();
</script>
<script src="./shared/nav.js"></script>
</body>
</html>
